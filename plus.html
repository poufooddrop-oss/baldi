<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/baldi-plus/">
    <meta charset="utf-8">
    <title>Unity WebGL Player | Baldi's Basics Plus</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #231F20;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background: black;
        }

        #unity-canvas {
            width: 1280px;
            height: 720px;
            display: block;
        }

        :fullscreen #game-container {
            width: 100vw;
            height: 100vh;
        }

        :fullscreen #unity-canvas {
            width: 100%;
            height: 100%;
        }

        #fullscreen-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 10;
            padding: 10px 18px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            background: #0078ff;
            color: white;
            cursor: pointer;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <div id="loading-text" style="color:white;font-size:48px;font-family:cursive;text-align:center;margin-top:20px;">
            LOADING...
        </div>

        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <button id="fullscreen-btn">Fullscreen</button>
    </div>

    <script src="Build/Export.loader.js"></script>

    <script>
        const container = document.getElementById("game-container")
        const canvas = document.getElementById("unity-canvas")
        const fsBtn = document.getElementById("fullscreen-btn")
        const loadingText = document.getElementById("loading-text")

        fsBtn.onclick = () => {
            if (!document.fullscreenElement) {
                container.requestFullscreen()
                fsBtn.textContent = "Exit Fullscreen"
            } else {
                document.exitFullscreen()
                fsBtn.textContent = "Fullscreen"
            }
        }

        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) {
                fsBtn.textContent = "Fullscreen"
                canvas.style.width = "1280px"
                canvas.style.height = "720px"
            }
        })

        let totalBytes = 0
        let loadedBytes = 0

        function formatSize(bytes) {
            if (bytes > 1073741824) return (bytes / 1073741824).toFixed(2) + " GB"
            if (bytes > 1048576) return (bytes / 1048576).toFixed(2) + " MB"
            if (bytes > 1024) return (bytes / 1024).toFixed(2) + " KB"
            return bytes + " B"
        }

        async function getSize(url) {
            try {
                const r = await fetch(url, { method: "HEAD" })
                return parseInt(r.headers.get("Content-Length") || "0")
            } catch {
                return 0
            }
        }

        async function fetchWithProgress(url) {
            const r = await fetch(url)
            const reader = r.body.getReader()
            let received = 0
            let chunks = []

            while (true) {
                const { done, value } = await reader.read()
                if (done) break
                received += value.length
                loadedBytes += value.length
                chunks.push(value)
                loadingText.textContent =
                    "LOADING... " +
                    formatSize(loadedBytes) +
                    " / " +
                    formatSize(totalBytes) +
                    " (" +
                    ((loadedBytes / totalBytes) * 100).toFixed(1) +
                    "%)"
            }

            let buffer = new Uint8Array(received)
            let offset = 0
            for (let c of chunks) {
                buffer.set(c, offset)
                offset += c.length
            }
            return buffer.buffer
        }

        function getParts(file, count) {
            return Array.from({ length: count }, (_, i) => file + ".part" + (i + 1))
        }

        async function merge(parts) {
            const buffers = await Promise.all(parts.map(fetchWithProgress))
            return URL.createObjectURL(new Blob(buffers))
        }

        ;(async () => {
            const dataParts = getParts("Build/Export.data", 2)
            const wasmParts = getParts("Build/Export.wasm", 3)

            const sizes = await Promise.all([...dataParts, ...wasmParts].map(getSize))
            totalBytes = sizes.reduce((a, b) => a + b, 0)

            const [dataUrl, wasmUrl] = await Promise.all([
                merge(dataParts),
                merge(wasmParts)
            ])

            createUnityInstance(canvas, {
                dataUrl,
                frameworkUrl: "Build/Export.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Basically Games",
                productName: "Baldi's Basics Plus",
                productVersion: "0.3.2",
            }).then(() => loadingText.remove())
        })()
    </script>
</body>
</html>
