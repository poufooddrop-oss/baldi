<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/baldi-remaster/">
    <meta charset="utf-8">
    <title>Unity WebGL Player | Baldi's Basics Classic Remastered</title>

    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #231F20;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            width: 854px;
            height: 480px;
            background: black;
            position: relative;
        }

        #unity-canvas {
            width: 854px;
            height: 480px;
            display: block;
        }

        #fullscreen-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            padding: 8px 14px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            background: #0078ff;
            color: white;
            cursor: pointer;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <div id="loading-text" style="color:white;font-size:32px;font-family:sans-serif;text-align:center;margin-top:20px;">
            LOADING...
        </div>

        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <button id="fullscreen-btn">Fullscreen</button>
    </div>

    <script src="Build/WebGL.loader.js"></script>

    <script>
        const ua = navigator.userAgent.toLowerCase()
        const isSwitch = ua.includes("nintendo")

        const container = document.getElementById("game-container")
        const canvas = document.getElementById("unity-canvas")
        const fsBtn = document.getElementById("fullscreen-btn")
        const loadingText = document.getElementById("loading-text")

        if (isSwitch) {
            fsBtn.style.display = "none"
            document.body.style.zoom = "0.9"
        }

        fsBtn.onclick = () => {
            if (!document.fullscreenElement) {
                container.requestFullscreen()
                fsBtn.textContent = "Exit Fullscreen"
            } else {
                document.exitFullscreen()
                fsBtn.textContent = "Fullscreen"
            }
        }

        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) {
                fsBtn.textContent = "Fullscreen"
                canvas.style.width = "854px"
                canvas.style.height = "480px"
            }
        })

        let totalBytes = 0
        let loadedBytes = 0

        function formatSize(bytes) {
            if (bytes > 1073741824) return (bytes / 1073741824).toFixed(2) + " GB"
            if (bytes > 1048576) return (bytes / 1048576).toFixed(2) + " MB"
            if (bytes > 1024) return (bytes / 1024).toFixed(2) + " KB"
            return bytes + " B"
        }

        async function getSize(url) {
            try {
                const r = await fetch(url, { method: "HEAD" })
                return parseInt(r.headers.get("Content-Length") || "0")
            } catch {
                return 0
            }
        }

        async function fetchWithProgress(url) {
            const r = await fetch(url)
            const reader = r.body.getReader()
            let received = 0
            let chunks = []

            while (true) {
                const { done, value } = await reader.read()
                if (done) break
                received += value.length
                loadedBytes += value.length
                chunks.push(value)

                if (!isSwitch) {
                    loadingText.textContent =
                        "LOADING... " +
                        formatSize(loadedBytes) +
                        " / " +
                        formatSize(totalBytes) +
                        " (" +
                        ((loadedBytes / totalBytes) * 100).toFixed(1) +
                        "%)"
                }
            }

            let buffer = new Uint8Array(received)
            let offset = 0
            for (let c of chunks) {
                buffer.set(c, offset)
                offset += c.length
            }
            return buffer.buffer
        }

        function getParts(file, count) {
            return Array.from({ length: count }, (_, i) => file + ".part" + (i + 1))
        }

        async function merge(parts) {
            const buffers = await Promise.all(parts.map(fetchWithProgress))
            return URL.createObjectURL(new Blob(buffers))
        }

        ;(async () => {
            const dataParts = getParts("Build/WebGL.data", 3)
            const wasmParts = getParts("Build/WebGL.wasm", 3)

            const sizes = await Promise.all([...dataParts, ...wasmParts].map(getSize))
            totalBytes = sizes.reduce((a, b) => a + b, 0)

            const [dataUrl, wasmUrl] = await Promise.all([
                merge(dataParts),
                merge(wasmParts)
            ])

            createUnityInstance(canvas, {
                dataUrl,
                frameworkUrl: "Build/WebGL.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Basically Games",
                productName: "Baldi's Basics Classic Remastered",
                productVersion: "1.1",
                devicePixelRatio: 1,
                matchWebGLToCanvasSize: true,
            }).then(() => {
                loadingText.remove()
            }).catch(() => {
                loadingText.textContent = "FAILED TO LOAD"
            })
        })()
    </script>
</body>
</html>
